[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-han-agent"
version = "0.1.0"
description = "HAN-inspired multi-agent pipeline for enterprise industrial risk analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Enterprise-HAN-Agent Contributors" }
]
keywords = ["agent", "risk-analysis", "heterogeneous-graph", "han", "metapath"]
dependencies = []

[project.scripts]
enterprise-han-agent = "enterprise_han_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
